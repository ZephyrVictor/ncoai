[project]
name = "ncoai-chainlit-app"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=50.0.2,<51.0.0",
  "openai>=3.37.0,<4.0.0",
  "playwright>=1.64.1,<2.0.0",
  "prometheus-client>=0.26.0,<1.0.0",
  "pyftpdlib>=2.2.0,<3.0.0",
  "pyOpenSSL>=26.4.0,<27.0.0",
  "requests>=2.34.2,<3.0.0",
  "redis>=8.1.0,<9.0.0",
  "tiktoken>=0.14.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ncoai_chainlit_app"]
