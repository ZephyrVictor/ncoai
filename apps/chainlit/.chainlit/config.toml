[project]
user_env = []
session_timeout = 3600
user_session_timeout = 1296000
cache = false
persist_user_env = false
mask_user_env = true
allow_origins = ["*"]

[features]
unsafe_allow_html = false
latex = true
user_message_markdown = true
user_message_autoscroll = true
assistant_message_autoscroll = true
auto_tag_thread = true
edit_message = false
allow_thread_sharing = false
favorites = false

[features.spontaneous_file_upload]
enabled = false
accept = ["*/*"]
max_files = 1
max_size_mb = 10

[features.audio]
enabled = false
sample_rate = 24000

[features.mcp]
enabled = false

[features.mcp.sse]
enabled = false

[features.mcp.streamable-http]
enabled = false

[features.mcp.stdio]
enabled = false
allowed_executables = []

[UI]
name = "NCOAI Chat"
layout = "wide"
default_sidebar_state = "open"
confirm_new_chat = false
cot = "hidden"
alert_style = "classic"

[meta]
generated_by = "2.10.0"
