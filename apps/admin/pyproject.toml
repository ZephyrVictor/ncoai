[project]
name = "ncoai-admin-app"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=50.0.2,<51.0.0",
  "fastapi>=0.162.0,<1.0.0",
  "uvicorn>=0.54.0,<1.0.0",
  "jinja2>=3.1.0,<4.0.0",
  "itsdangerous>=2.2.0,<3.0.0",
  "bcrypt>=4.1.0,<5.0.0",
  "prometheus-client>=0.26.0,<1.0.0",
  "python-multipart>=0.0.32,<1.0.0",
  "sqlalchemy>=2.0.0,<3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ncoai_admin_app"]
