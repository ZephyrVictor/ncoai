[project]
name = "ncoai-admin-app"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn>=0.30.0,<1.0.0",
  "jinja2>=3.1.0,<4.0.0",
  "bcrypt>=4.1.0,<5.0.0",
  "python-multipart>=0.0.9,<1.0.0",
  "sqlalchemy>=2.0.0,<3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
