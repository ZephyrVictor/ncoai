server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/?(.*)"
        replacement: "$1"
        target_label: "container"
      - source_labels: ["container"]
        regex: "ncoai-(.*)"
        replacement: "$1"
        target_label: "service"
      - target_label: "source"
        replacement: "docker"
      - target_label: "instance"
        replacement: "docker"
    pipeline_stages:
      - docker: {}
      - regex:
          expression: "(?i)\\b(?P<level>debug|info|warn|warning|error|fatal|critical)\\b"
      - labels:
          level:

  - job_name: host-services
    static_configs:
      - targets:
          - localhost
        labels:
          job: host-services
          source: host
          instance: host
          __path__: /var/log/ncoai-host/*.log
    pipeline_stages:
      - regex:
          source: filename
          expression: "^/var/log/ncoai-host/(?P<service>[^/]+)\\.log$"
      - labels:
          service:
      - regex:
          expression: "(?i)\\b(?P<level>debug|info|warn|warning|error|fatal|critical)\\b"
      - labels:
          level:
