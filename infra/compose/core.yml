services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    container_name: ncoai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ncoai_chat}
      POSTGRES_USER: ${POSTGRES_USER:-ncoai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ncoai_dev}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ncoai} -d ${POSTGRES_DB:-ncoai_chat}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: ${REDIS_IMAGE:-redis:7}
    container_name: ncoai-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  nginx:
    image: ${NGINX_IMAGE:-nginx:alpine}
    container_name: ncoai-nginx
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CHAINLIT_PORT: ${CHAINLIT_PORT:-3100}
      ADMIN_APP_PORT: ${ADMIN_APP_PORT:-3200}
    ports:
      - "${NGINX_PORT:-8088}:80"
    volumes:
      - ../nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
    command:
      - /bin/sh
      - -lc
      - |
        envsubst '$$CHAINLIT_PORT $$ADMIN_APP_PORT' \
          < /etc/nginx/templates/nginx.conf.template \
          > /etc/nginx/nginx.conf
        exec nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  redis_data:
