services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    container_name: ncoai-postgres
    restart: unless-stopped
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-400}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-8GB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-48GB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-1GB}
      - -c
      - wal_buffers=${POSTGRES_WAL_BUFFERS:-32MB}
      - -c
      - max_wal_size=${POSTGRES_MAX_WAL_SIZE:-8GB}
      - -c
      - min_wal_size=${POSTGRES_MIN_WAL_SIZE:-1GB}
      - -c
      - checkpoint_completion_target=${POSTGRES_CHECKPOINT_COMPLETION_TARGET:-0.9}
      - -c
      - effective_io_concurrency=${POSTGRES_EFFECTIVE_IO_CONCURRENCY:-200}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ncoai_chat}
      POSTGRES_USER: ${POSTGRES_USER:-ncoai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ncoai_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ncoai} -d ${POSTGRES_DB:-ncoai_chat}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: ${REDIS_IMAGE:-redis:7}
    container_name: ncoai-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  nginx:
    image: ${NGINX_IMAGE:-nginx:alpine}
    container_name: ncoai-nginx
    restart: unless-stopped
    network_mode: host
    depends_on:
      - postgres
      - redis
    environment:
      NGINX_PORT: ${NGINX_PORT:-8088}
      GRAFANA_PORT: ${GRAFANA_PORT:-3001}
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
      NGINX_PUBLIC_HTTP_PORT: ${NGINX_PUBLIC_HTTP_PORT:-80}
      NGINX_PUBLIC_HTTPS_PORT: ${NGINX_PUBLIC_HTTPS_PORT:-443}
      NGINX_ENABLE_TLS: ${NGINX_ENABLE_TLS:-0}
      NGINX_ACME_WEBROOT: ${NGINX_ACME_WEBROOT:-/tmp/ncoai-certbot}
      NGINX_SSL_CERT: ${NGINX_SSL_CERT:-}
      NGINX_SSL_KEY: ${NGINX_SSL_KEY:-}
      CHAINLIT_PORT: ${CHAINLIT_PORT:-3100}
      CHAINLIT_WORKER_COUNT: ${CHAINLIT_WORKER_COUNT:-4}
      CHAINLIT_WORKER_BASE_PORT: ${CHAINLIT_WORKER_BASE_PORT:-3100}
      ADMIN_APP_PORT: ${ADMIN_APP_PORT:-3200}
    volumes:
      - ../nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ../nginx/nginx.public-http.conf.template:/etc/nginx/templates/nginx.public-http.conf.template:ro
      - ../nginx/nginx.tls.conf.template:/etc/nginx/templates/nginx.tls.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ${NGINX_ACME_WEBROOT:-/tmp/ncoai-certbot}:${NGINX_ACME_WEBROOT:-/tmp/ncoai-certbot}:ro
    command:
      - /bin/sh
      - -lc
      - |
        if [ "${NGINX_SERVER_NAME:-_}" != "_" ] && [ "${NGINX_PORT:-8088}" = "${NGINX_PUBLIC_HTTP_PORT:-80}" ]; then
          echo "[ERROR] NGINX_PORT must differ from NGINX_PUBLIC_HTTP_PORT when public HTTP is enabled." >&2
          exit 1
        fi
        if [ "${NGINX_ENABLE_TLS:-0}" = "1" ] && [ "${NGINX_PORT:-8088}" = "${NGINX_PUBLIC_HTTPS_PORT:-443}" ]; then
          echo "[ERROR] NGINX_PORT must differ from NGINX_PUBLIC_HTTPS_PORT when TLS is enabled." >&2
          exit 1
        fi
        if [ "${NGINX_ENABLE_TLS:-0}" = "1" ] && [ "${NGINX_PUBLIC_HTTP_PORT:-80}" = "${NGINX_PUBLIC_HTTPS_PORT:-443}" ]; then
          echo "[ERROR] NGINX_PUBLIC_HTTP_PORT and NGINX_PUBLIC_HTTPS_PORT must differ." >&2
          exit 1
        fi
        chainlit_worker_count="$${CHAINLIT_WORKER_COUNT:-1}"
        chainlit_worker_base_port="$${CHAINLIT_WORKER_BASE_PORT:-$${CHAINLIT_PORT:-3100}}"
        chainlit_upstream_servers=""
        i=0
        while [ "$$i" -lt "$$chainlit_worker_count" ]; do
          port=$$((chainlit_worker_base_port + i))
          chainlit_upstream_servers="$${chainlit_upstream_servers}    server 127.0.0.1:$${port};\n"
          i=$$((i + 1))
        done
        export CHAINLIT_UPSTREAM_SERVERS="$$(printf '%b' "$$chainlit_upstream_servers")"

        if [ "${NGINX_ENABLE_TLS:-0}" = "1" ]; then
          if [ -z "${NGINX_SSL_CERT:-}" ] || [ -z "${NGINX_SSL_KEY:-}" ]; then
            echo "[ERROR] NGINX_SSL_CERT and NGINX_SSL_KEY are required when NGINX_ENABLE_TLS=1." >&2
            exit 1
          fi
          if [ ! -f "${NGINX_SSL_CERT}" ] || [ ! -f "${NGINX_SSL_KEY}" ]; then
            echo "[ERROR] TLS certificate files not found: ${NGINX_SSL_CERT} / ${NGINX_SSL_KEY}" >&2
            exit 1
          fi
          envsubst '$$NGINX_PORT $$CHAINLIT_PORT $$CHAINLIT_UPSTREAM_SERVERS $$ADMIN_APP_PORT $$GRAFANA_PORT $$NGINX_SERVER_NAME $$NGINX_PUBLIC_HTTP_PORT $$NGINX_PUBLIC_HTTPS_PORT $$NGINX_ACME_WEBROOT $$NGINX_SSL_CERT $$NGINX_SSL_KEY' \
            < /etc/nginx/templates/nginx.tls.conf.template \
            > /etc/nginx/nginx.conf
        elif [ "${NGINX_SERVER_NAME:-_}" != "_" ]; then
          envsubst '$$NGINX_PORT $$CHAINLIT_PORT $$CHAINLIT_UPSTREAM_SERVERS $$ADMIN_APP_PORT $$GRAFANA_PORT $$NGINX_SERVER_NAME $$NGINX_PUBLIC_HTTP_PORT $$NGINX_ACME_WEBROOT' \
            < /etc/nginx/templates/nginx.public-http.conf.template \
            > /etc/nginx/nginx.conf
        else
          envsubst '$$NGINX_PORT $$CHAINLIT_PORT $$CHAINLIT_UPSTREAM_SERVERS $$ADMIN_APP_PORT $$GRAFANA_PORT' \
            < /etc/nginx/templates/nginx.conf.template \
            > /etc/nginx/nginx.conf
        fi
        exec nginx -g 'daemon off;'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSI http://127.0.0.1:${NGINX_PORT:-8088}/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  redis_data:
