global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: litellm
    static_configs:
      - targets: ["host.docker.internal:4000"]

  - job_name: vllm
    static_configs:
      - targets: ["host.docker.internal:8000"]
