global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: litellm-metrics
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:33455"]

  - job_name: vllm-metrics
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:12233"]

  - job_name: admin-metrics
    metrics_path: /admin/metrics
    static_configs:
      - targets: ["host.docker.internal:3200"]

  - job_name: chainlit-metrics
    metrics_path: /chat/metrics
    static_configs:
      - targets: ["host.docker.internal:3100"]

  - job_name: host-service-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://host.docker.internal:3100/chat/health
          - http://host.docker.internal:3200/admin/healthz
          - http://host.docker.internal:33455/metrics
          - http://host.docker.internal:12233/metrics
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
